<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
  <filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="26"/></filter>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232850"/><stop offset="1" stop-color="#0B0D1C"/></linearGradient>
  <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="220" y1="0" x2="800" y2="0">
    <stop offset="0" stop-color="#FF8A4C"/><stop offset="0.38" stop-color="#FF3F6C"/><stop offset="0.62" stop-color="#FFC2D2"/><stop offset="1" stop-color="#FFFFFF"/>
  </linearGradient>
</defs>
<rect x="100" y="114" width="824" height="824" rx="185" fill="#000" opacity=".38" filter="url(#drop)"/>
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
<g id="mark">
  <!-- the voice -->
  <rect x="208" y="402" width="60" height="220" rx="30"/>
  <rect x="298" y="292" width="60" height="440" rx="30"/>
  <rect x="388" y="352" width="60" height="320" rx="30"/>
  <!-- the words -->
  <rect x="478" y="372" width="316" height="60" rx="30"/>
  <rect x="478" y="482" width="270" height="60" rx="30"/>
  <rect x="478" y="592" width="190" height="60" rx="30"/>
</g>
<use href="#mark" fill="url(#ink)" opacity=".55" filter="url(#glow)"/>
<use href="#mark" fill="url(#ink)"/>
</svg>
